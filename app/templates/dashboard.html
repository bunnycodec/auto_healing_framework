<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Auto-Healing — Live Dashboard</title>
    <style>
      /* ──────────────────────────────────────────────────────────────────
         Apollo design tokens
         Primitive tokens describe raw values; semantic tokens map them to
         roles. Components only ever consume semantic tokens.
         ────────────────────────────────────────────────────────────────── */
      :root {
        /* Primitive — color */
        --apollo-color-ink-900: #0b0e14;
        --apollo-color-ink-800: #141925;
        --apollo-color-ink-700: #1b2230;
        --apollo-color-ink-600: #243044;
        --apollo-color-cloud-100: #e6edf3;
        --apollo-color-cloud-400: #8b98a9;
        --apollo-color-azure-400: #4cc9f0;
        --apollo-color-violet-400: #a371f7;
        --apollo-color-emerald-400: #3fb950;
        --apollo-color-rose-400: #f85149;
        --apollo-color-amber-400: #d29922;

        /* Primitive — spacing scale (4px base) */
        --apollo-space-1: 4px;  --apollo-space-2: 8px;  --apollo-space-3: 12px;
        --apollo-space-4: 16px; --apollo-space-5: 20px; --apollo-space-6: 24px;

        /* Primitive — radius scale */
        --apollo-radius-sm: 6px; --apollo-radius-md: 10px;
        --apollo-radius-lg: 14px; --apollo-radius-pill: 999px;

        /* Primitive — typography */
        --apollo-font-family: ui-sans-serif, system-ui, sans-serif;
        --apollo-font-size-xs: .72rem; --apollo-font-size-sm: .82rem;
        --apollo-font-size-md: .9rem;  --apollo-font-size-lg: 1.05rem;
        --apollo-font-size-xl: 1.9rem;
        --apollo-font-weight-regular: 400; --apollo-font-weight-medium: 600;
        --apollo-font-weight-bold: 700;

        /* Primitive — elevation */
        --apollo-elevation-1: 0 1px 2px rgba(0,0,0,.4);
        --apollo-elevation-2: 0 6px 22px rgba(0,0,0,.35);

        /* Semantic — surfaces, text, borders */
        --apollo-surface-canvas: var(--apollo-color-ink-900);
        --apollo-surface-raised: var(--apollo-color-ink-800);
        --apollo-surface-overlay: var(--apollo-color-ink-700);
        --apollo-border-subtle: var(--apollo-color-ink-600);
        --apollo-text-default: var(--apollo-color-cloud-100);
        --apollo-text-muted: var(--apollo-color-cloud-400);
        --apollo-accent: var(--apollo-color-azure-400);

        /* Semantic — status */
        --apollo-status-healed: var(--apollo-color-emerald-400);
        --apollo-status-failed: var(--apollo-color-rose-400);
        --apollo-status-duplicate: var(--apollo-color-amber-400);
        --apollo-status-pr: var(--apollo-color-violet-400);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--apollo-font-family);
        background: var(--apollo-surface-canvas); color: var(--apollo-text-default); }
      header { display: flex; align-items: center; justify-content: space-between;
        padding: var(--apollo-space-4) var(--apollo-space-6);
        border-bottom: 1px solid var(--apollo-border-subtle); }
      header h1 { font-size: var(--apollo-font-size-lg); margin: 0;
        display: flex; align-items: center; gap: var(--apollo-space-3); }
      .live { display: inline-flex; align-items: center; gap: var(--apollo-space-1);
        font-size: var(--apollo-font-size-xs); color: var(--apollo-text-muted); }
      .dot { width: 9px; height: 9px; border-radius: var(--apollo-radius-pill);
        background: var(--apollo-status-healed); animation: pulse 1.6s infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
      main { padding: var(--apollo-space-5) var(--apollo-space-6); max-width: 1200px; margin: 0 auto; }
      .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--apollo-space-3); }
      .card { background: var(--apollo-surface-raised); border: 1px solid var(--apollo-border-subtle);
        border-radius: var(--apollo-radius-lg); padding: var(--apollo-space-4);
        box-shadow: var(--apollo-elevation-1); }
      .card .label { color: var(--apollo-text-muted); font-size: var(--apollo-font-size-xs);
        text-transform: uppercase; letter-spacing: .05em; }
      .card .value { font-size: var(--apollo-font-size-xl); font-weight: var(--apollo-font-weight-bold); margin-top: var(--apollo-space-1); }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--apollo-space-4); margin-top: var(--apollo-space-5); }
      @media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
      .panel { background: var(--apollo-surface-raised); border: 1px solid var(--apollo-border-subtle);
        border-radius: var(--apollo-radius-lg); padding: var(--apollo-space-4); box-shadow: var(--apollo-elevation-1); }
      .panel h2 { font-size: var(--apollo-font-size-md); margin: 0 0 var(--apollo-space-3);
        color: var(--apollo-text-muted); text-transform: uppercase; letter-spacing: .05em; }
      table { width: 100%; border-collapse: collapse; font-size: var(--apollo-font-size-sm); }
      th, td { text-align: left; padding: var(--apollo-space-2); border-bottom: 1px solid var(--apollo-border-subtle); }
      th { color: var(--apollo-text-muted); font-weight: var(--apollo-font-weight-medium); }
      td code { background: var(--apollo-surface-overlay); padding: var(--apollo-space-1) var(--apollo-space-2);
        border-radius: var(--apollo-radius-sm); font-size: var(--apollo-font-size-xs);
        display: inline-block; white-space: pre-wrap; word-break: break-all; max-width: 100%; }
      td code.before { background: rgba(248,81,73,.14); color: var(--apollo-status-failed); }
      td code.after { background: rgba(63,185,80,.14); color: var(--apollo-status-healed); }
      .pill { display: inline-block; padding: var(--apollo-space-1) var(--apollo-space-3);
        border-radius: var(--apollo-radius-pill); font-size: var(--apollo-font-size-xs); font-weight: var(--apollo-font-weight-medium); }
      .s-healed { background: rgba(63,185,80,.18); color: var(--apollo-status-healed); }
      .s-failed, .s-restored { background: rgba(248,81,73,.18); color: var(--apollo-status-failed); }
      .s-duplicate { background: rgba(210,153,34,.18); color: var(--apollo-status-duplicate); }
      .empty { color: var(--apollo-text-muted); padding: var(--apollo-space-4) 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>🩹 AI Auto-Healing <span style="color:var(--apollo-text-muted);font-weight:400">Live Dashboard</span></h1>
      <span class="live"><span class="dot" id="livedot"></span><span id="livetext">connecting…</span></span>
    </header>
    <main>
      <div class="cards" id="cards"></div>

      <div class="panel" style="margin-top:var(--apollo-space-5)">
        <h2>Recent healing events</h2>
        <div id="recent"></div>
      </div>

      <div class="panel" style="margin-top:var(--apollo-space-4)">
        <h2>Runs (latest first)</h2>
        <div id="runs"></div>
      </div>
    </main>

    <script>
      function getCssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

      function card(label, value){ return `<div class="card"><div class="label">${label}</div><div class="value">${value}</div></div>`; }

      function renderRecent(recent){
        const el = document.getElementById('recent');
        if(!recent || !recent.length){ el.innerHTML = '<div class="empty">No events yet — run <code>auto-healer run</code></div>'; return; }
        el.innerHTML = `<table><thead><tr>
            <th>Time</th><th>Test</th><th>Status</th><th>Before</th><th>After</th><th>Conf.</th></tr></thead><tbody>` +
          recent.map(r => `<tr>
              <td>${(r.created_at||'').slice(11,19) || '—'}</td>
              <td>${escapeHtml(r.test_name || '—')}</td>
              <td><span class="pill s-${r.status}">${r.status}</span></td>
              <td>${r.old_locator ? `<code class="before">${escapeHtml(r.old_locator)}</code>` : '<span style="color:var(--apollo-text-muted)">'+escapeHtml(r.category||'—')+'</span>'}</td>
              <td>${r.new_locator ? `<code class="after">${escapeHtml(r.new_locator)}</code>` : '—'}</td>
              <td>${r.confidence != null ? Math.round(r.confidence*100)+'%' : '—'}</td>
            </tr>`).join('') + `</tbody></table>`;
      }

      function renderRuns(runs){
        const el = document.getElementById('runs');
        if(!runs || !runs.length){ el.innerHTML = '<div class="empty">No runs recorded yet</div>'; return; }
        el.innerHTML = `<table><thead><tr>
            <th>Run</th><th>When</th><th>Healed</th><th>Failed</th><th>Duplicate</th><th>Total</th></tr></thead><tbody>` +
          runs.map(r => `<tr>
              <td><code>${escapeHtml(r.run_id || '—')}</code></td>
              <td>${(r.created_at||'').slice(0,19).replace('T',' ') || '—'}</td>
              <td><span class="pill s-healed">${r.healed||0}</span></td>
              <td>${r.failed ? `<span class="pill s-failed">${r.failed}</span>` : '0'}</td>
              <td>${r.duplicate ? `<span class="pill s-duplicate">${r.duplicate}</span>` : '0'}</td>
              <td>${r.total||0}</td>
            </tr>`).join('') + `</tbody></table>`;
      }

      function escapeHtml(s){ return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

      function render(m){
        document.getElementById('cards').innerHTML =
          card('Heal rate', Math.round((m.heal_rate||0)*100)+'%') +
          card('Healed', m.healed||0) +
          card('Failed', m.failed||0) +
          card('Avg confidence', Math.round((m.avg_confidence||0)*100)+'%') +
          card('Runs', m.total_runs||0);
        renderRecent(m.recent);
        renderRuns(m.runs);
      }

      async function loadOnce(){
        try { const r = await fetch('/metrics'); render(await r.json()); } catch(e){}
      }

      function connectStream(){
        const dot = document.getElementById('livedot'), txt = document.getElementById('livetext');
        try {
          const es = new EventSource('/metrics/stream');
          es.onopen = () => { dot.style.background = getCssVar('--apollo-status-healed'); txt.textContent = 'live'; };
          es.onmessage = (e) => { try { render(JSON.parse(e.data)); } catch(_){} };
          es.onerror = () => { dot.style.background = getCssVar('--apollo-status-failed'); txt.textContent = 'reconnecting…'; };
        } catch(e) { setInterval(loadOnce, 5000); }
      }

      loadOnce();
      connectStream();
    </script>
  </body>
</html>
